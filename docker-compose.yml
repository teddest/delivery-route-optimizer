services:
  db:
    image: postgis/postgis:16-3.4
    container_name: delivery-route-optimizer-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: route_optimizer
      POSTGRES_USER: optimizer
      POSTGRES_PASSWORD: optimizer
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U optimizer -d route_optimizer"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
